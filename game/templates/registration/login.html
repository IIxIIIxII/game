<!DOCTYPE html>
<html>
<head>
    <title>Вход</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #e0e0e0; display: grid; place-items: center; min-height: 100vh; }
        .login-container { background: #1f1f3d; padding: 30px; border-radius: 10px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #2f2f4d; border: 1px solid #555; color: white; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #a942e0; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Вход в Космическую Игру</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Войти</button>
        </form>
        <p style="margin-top: 15px; text-align: center;">
            <small>Для теста используйте:<br>Логин: testuser<br>Пароль: testpass123</small>
        </p>
    </div>
</body>
</html>
