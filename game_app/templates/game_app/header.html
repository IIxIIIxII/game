<style>
    /* --- СТИЛИ HEADER И МЕНЮ --- */
    header {
        position: fixed; top: 0; left: 0; width: 100%; padding: 20px 40px; 
        box-sizing: border-box; display: flex; justify-content: space-between; 
        align-items: center; z-index: 1000; backdrop-filter: blur(20px);
        background: rgba(0, 0, 0, 0.7); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-spacer { width: 150px; } 
    .logo {
        font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900;
        background: linear-gradient(90deg, #fff, #d946ef);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        text-transform: uppercase; letter-spacing: 8px;
    }

    .menu-container { position: relative; }
    .menu-btn {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.1);
        color: white; padding: 10px 25px; border-radius: 8px; cursor: pointer;
        font-family: 'Orbitron', sans-serif; font-size: 0.8rem; transition: 0.3s;
    }
    .dropdown-content {
        display: none; position: absolute; top: calc(100% + 10px); right: 0;
        background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1);
        min-width: 220px; border-radius: 12px; overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .dropdown-content.active { display: block; }
    .dropdown-content a {
        color: white; padding: 14px 20px; text-decoration: none; display: block;
        font-family: 'Orbitron', sans-serif; font-size: 0.75rem; transition: 0.2s;
        cursor: pointer;
    }
    .dropdown-content a:hover { background: #d946ef; }

    /* --- СТИЛИ МОДАЛОК (ПОДДЕРЖКА И ПОДТВЕРЖДЕНИЕ) --- */
    .header-modal-overlay { 
        display: none; position: fixed; z-index: 5000; top: 0; left: 0; 
        width: 100%; height: 100%; background: rgba(0,0,0,0.85); 
        backdrop-filter: blur(10px); align-items: center; justify-content: center; 
    }
    .header-modal-content { 
        background: #1e1e3f; padding: 40px; border-radius: 25px; 
        border: 1px solid #d946ef; width: 100%; max-width: 450px; 
        display: flex; flex-direction: column; box-sizing: border-box; text-align: center;
        box-shadow: 0 0 30px rgba(217, 70, 239, 0.2);
    }
    .h-modal-title { color: white; font-family: 'Orbitron'; font-size: 1.2rem; margin-bottom: 25px; text-transform: uppercase; }
    
    .h-modal-btns { display: flex; gap: 15px; }
    .h-modal-btn {
        flex: 1; padding: 15px; border: none; border-radius: 12px; cursor: pointer; 
        font-family: 'Orbitron', sans-serif; font-weight: 900; transition: 0.3s; color: white;
        text-transform: uppercase; font-size: 0.8rem;
    }
    .h-btn-cancel { background: #334155; }
    .h-btn-confirm { background: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }
    .h-btn-confirm:hover { background: #ff2e74; transform: scale(1.02); }

    .support-input {
        width: 100%; padding: 15px; background: rgba(0,0,0,0.5); 
        border: 1px solid rgba(255, 255, 255, 0.1); color: white; 
        border-radius: 10px; outline: none; font-family: 'Orbitron', sans-serif; 
        box-sizing: border-box; transition: 0.3s; font-size: 0.9rem; margin-bottom: 15px;
    }
</style>

<header>
    <div class="header-spacer"></div>
    <div class="logo">CrewFall</div>
    <div class="menu-container">
        <button class="menu-btn" id="headerMenuBtn">МЕНЮ ▼</button>
        <div class="dropdown-content" id="headerMenuDropdown">
            {% if game %}
                <a onclick="openRules()">ПРАВИЛА</a>
                {% if not is_host %}
                    <a onclick="leaveGame()">ВЫЙТИ ИЗ ЛОББИ</a>
                {% endif %}
                {% if is_host %}
                    <a style="color: #ff0055;" onclick="disbandRoom()">РАСПУСТИТЬ ЛОББИ</a>
                {% endif %}
            {% else %}
                <a href="#">ВОЙТИ</a>
            {% endif %}
            <a onclick="openSupport(event)">ТЕХПОДДЕРЖКА</a>
        </div>
    </div>
</header>

<div id="header-confirm-modal" class="header-modal-overlay">
    <div class="header-modal-content">
        <h3 id="h-confirm-title" class="h-modal-title">ВНИМАНИЕ</h3>
        <div class="h-modal-btns">
            <button class="h-modal-btn h-btn-cancel" onclick="closeHeaderConfirm()">ОТМЕНА</button>
            <button id="h-confirm-yes-btn" class="h-modal-btn h-btn-confirm">ПОДТВЕРДИТЬ</button>
        </div>
    </div>
</div>

{% if is_host and game %}
<form id="header-delete-room-form" method="post" action="{% url 'game_lobby' %}" style="display: none;">
    {% csrf_token %}
    <input type="hidden" name="action" value="delete_room">
</form>
{% endif %}

<div id="support-modal-box" class="header-modal-overlay">
    <div class="header-modal-content">
        <h3 class="h-modal-title">ТЕХПОДДЕРЖКА</h3>
        <input type="text" id="support-name" class="support-input" placeholder="ВАШЕ ИМЯ">
        <textarea id="support-text" class="support-input" style="resize: none;" placeholder="СООБЩЕНИЕ..." rows="4"></textarea>
        <div class="h-modal-btns">
            <button class="h-modal-btn h-btn-cancel" onclick="closeSupport()">ОТМЕНА</button>
            <button class="h-modal-btn" style="background: linear-gradient(135deg, #d946ef, #6366f1);" onclick="closeSupport()">ОТПРАВИТЬ</button>
        </div>
    </div>
</div>

<script>
    const hMenuBtn = document.getElementById('headerMenuBtn');
    const hMenuDropdown = document.getElementById('headerMenuDropdown');
    
    hMenuBtn.onclick = (e) => { e.stopPropagation(); hMenuDropdown.classList.toggle('active'); };
    window.onclick = () => { hMenuDropdown.classList.remove('active'); };

    // ОТКРЫТИЕ ПРАВИЛ
    function openRules() {
        const rules = document.getElementById('rules-modal');
        if (rules) rules.style.display = 'flex';
        hMenuDropdown.classList.remove('active');
    }

    // ЛОГИКА МОДАЛКИ ПОДТВЕРЖДЕНИЯ
    function showHeaderConfirm(title, onConfirm) {
        document.getElementById('h-confirm-title').innerText = title;
        document.getElementById('header-confirm-modal').style.display = 'flex';
        hMenuDropdown.classList.remove('active');

        document.getElementById('h-confirm-yes-btn').onclick = () => {
            onConfirm();
            closeHeaderConfirm();
        };
    }

    function closeHeaderConfirm() { document.getElementById('header-confirm-modal').style.display = 'none'; }

    // ФУНКЦИИ КНОПОК
    function leaveGame() {
        showHeaderConfirm('ПОКИНУТЬ ЭКИПАЖ?', () => {
            window.location.href = "{% url 'leave_game' game.room_code %}";
        });
    }

    function disbandRoom() {
        showHeaderConfirm('УНИЧТОЖИТЬ ЛОББИ?', () => {
            // Сначала пробуем форму (если мы в лобби)
            const form = document.getElementById('header-delete-room-form');
            if (form) {
                form.submit();
            } 
            // Если мы в игре, пробуем отправить сигнал через сокет (если он определен на странице)
            else if (typeof safeSend === "function") {
                safeSend({'type': 'disband_room'});
            }
        });
    }

    // ПОДДЕРЖКА
    function openSupport(e) { e.preventDefault(); document.getElementById('support-modal-box').style.display = 'flex'; hMenuDropdown.classList.remove('active'); }
    function closeSupport() { document.getElementById('support-modal-box').style.display = 'none'; }
</script>
