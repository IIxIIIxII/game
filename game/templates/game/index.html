{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Космическая игра</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color:#0b0f1a; color:white; text-align:center; }
    .avatar { width:70px; height:70px; border-radius:50%; margin:5px; cursor:pointer; border:2px solid transparent; }
    .avatar:hover, .selected { border:2px solid cyan; }
    .rules { position:fixed; top:20px; right:20px; width:40px; height:40px; background:#1a1f2e; border-radius:50%;
             display:flex; justify-content:center; align-items:center; cursor:pointer; }
    #rules-box { display:none; position:fixed; top:70px; right:20px; width:250px; background:#11172a;
                 padding:15px; border-radius:10px; text-align:left; }
  </style>
</head>
<body>
  <h1 class="mt-4">🚀 Космическая игра</h1>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex justify-content-center flex-wrap mt-3">
      {% for a in avatars %}
        <img src="{{a}}" class="avatar" onclick="selectAvatar(this)">
      {% endfor %}
    </div>
    <input type="hidden" name="avatar" id="avatarInput">
    <input type="text" name="nickname" class="form-control w-50 mx-auto mt-3" placeholder="Введите ник" required>
    <div class="mt-3">
      <button type="submit" name="action" value="create" class="btn btn-success">Создать комнату</button>
      <input type="text" name="room_code" placeholder="Код комнаты" class="form-control w-25 d-inline mx-2">
      <button type="submit" name="action" value="join" class="btn btn-primary">Присоединиться</button>
    </div>
  </form>

  {% if error %}<p class="text-danger mt-3">{{error}}</p>{% endif %}

  <div class="rules" onclick="toggleRules()">?</div>
  <div id="rules-box">
    <h5>Правила</h5>
    <p>👽 Среди игроков есть пришельцы.<br>
       💬 Убеждайте экипаж, куда лететь.<br>
       ⚠️ Если вы выберете координаты пришельца — поражение.</p>
  </div>

<script>
function selectAvatar(el){
  document.querySelectorAll('.avatar').forEach(a=>a.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('avatarInput').value = el.src;
}
function toggleRules(){
  const box=document.getElementById('rules-box');
  box.style.display=box.style.display==='block'?'none':'block';
}
</script>
</body>
</html>
